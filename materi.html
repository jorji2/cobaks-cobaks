    <!-- MATERI PERTAMA -->
    <button class="btn-tampil" onclick="tampilkanMateri()">
        Buka Materi
    </button>

    <div id="materi" class="kolom-materi"></div>

    <script>
        function tampilkanMateri() {
            var materi = document.getElementById("materi");
            var tombol = document.querySelector(".btn-tampil");

            materi.classList.toggle("aktif");

            if (materi.classList.contains("aktif")) {
                materi.innerHTML =
                    "<h3>Isi Teks dari Script</h3><p>Pak Kandi 67</p>" + "<audio autoplay><source src='PS2 Game selection sfx ... or hang up _ notification sound ▓ Free Sound Effect  IDK - VRT sound effects.mp3'></audio>";

                tombol.innerText = "Tutup Materi";
            }

            if (!materi.classList.contains("aktif")) {
                materi.innerHTML = "";
                tombol.innerText = "Buka Materi";
            }
        }
    </script>


    <!-- MATERI KEDUA -->
